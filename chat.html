<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat · SusCaballos</title><link rel="stylesheet" href="css/style.css"></head><body><main>
<h1>Chat de la comunidad</h1><p class="m">Los mensajes se sincronizan en tiempo real entre todos los usuarios conectados.</p><div class="card" id="msgs" aria-live="polite"></div><form class="row" id="f"><input id="m" placeholder="Escribe un mensaje" maxlength="300" required style="flex:4"><button style="flex:1">Enviar</button></form>
</main><script type="module">
import {$,esc,layout,sendMsg,onChat,hit} from './js/app.js';
const u=await layout('chat');
if(u){onChat(ms=>{const b=$('#msgs');b.innerHTML=ms.map(x=>`<div class="msg ${x.uid==u.uid?'me':''}"><span><b>${esc(x.u)}</b> <small>${esc(x.r)}</small><br>${esc(x.t)}</span></div>`).join('')||'<p class="m">Sé la primera persona en escribir.</p>';b.scrollTop=b.scrollHeight});
$('#f').onsubmit=async e=>{e.preventDefault();const t=$('#m').value.trim();$('#m').value='';if(t){await sendMsg(u,t);hit('chatMsgs')}}}
</script></body></html>
